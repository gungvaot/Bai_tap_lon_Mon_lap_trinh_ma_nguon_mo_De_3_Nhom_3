<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HPU Clubs – CLB &amp; Sự kiện sinh viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. TOKEN MÀU, CHỮ, BO GÓC
   Xanh HPU làm màu chính, cam làm điểm nhấn (điểm rèn luyện, đang diễn ra).
   ===================================================================== */
:root{
  --pri:#1747a6; --pri-2:#2563eb; --pri-l:#e8efff; --pri-tx:#fff;
  --acc:#f05a28; --acc-l:#fff1eb;
  --bg:#f3f5fa; --card:#fff; --tx:#152036; --mut:#5f6b80; --bd:#e2e7f0; --bd-s:#cdd5e2;
  --hover:#eef2f8; --ok:#0f8a4b; --ok-l:#e6f6ee; --er:#c62a2a; --er-l:#fdeeee; --warn:#b45309; --warn-l:#fff6e5;
  --shadow:0 1px 2px rgb(16 24 40/.06),0 8px 24px rgb(16 24 40/.06);
  --shadow-up:0 10px 30px rgb(23 71 166/.16);
  --r:16px; --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --pri:#4f83ff; --pri-2:#6b97ff; --pri-l:#1a2848; --acc:#ff7a4d; --acc-l:#3a2219;
  --bg:#0d1322; --card:#151d30; --tx:#eef2fa; --mut:#9aa6bd; --bd:#25304a; --bd-s:#33405e;
  --hover:#1c2640; --ok:#4ade80; --ok-l:#123222; --er:#f87171; --er-l:#3a1b1b; --warn:#fbbf24; --warn-l:#3a2c10;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25); --shadow-up:0 10px 30px rgb(0 0 0/.4); color-scheme:dark}}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri)}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* =====================================================================
   2. THÀNH PHẦN DÙNG CHUNG
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border:1px solid var(--bd-s);border-radius:12px;
  background:var(--card);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.pri{border-color:transparent;background:linear-gradient(135deg,var(--pri),var(--pri-2));color:#fff;box-shadow:0 6px 16px rgb(23 71 166/.25)}
.btn.pri:hover{box-shadow:0 8px 22px rgb(23 71 166/.35)}
.btn.acc{border-color:transparent;background:linear-gradient(135deg,var(--acc),#ff8a3d);color:#fff;box-shadow:0 6px 16px rgb(240 90 40/.3)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--hover);color:var(--tx)}
.btn.danger{border-color:transparent;background:transparent;color:var(--er)}
.btn.danger:hover{background:var(--er-l)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:52px;padding:12px 22px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{display:grid;gap:6px;font-size:13px;font-weight:600}
.input{width:100%;height:44px;padding:0 14px;border:1px solid var(--bd-s);border-radius:12px;background:var(--card);font-size:15px;font-weight:400;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:90px;padding:10px 14px;resize:vertical}
.input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l)}
.search{position:relative;flex:1 1 280px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--mut)}
.search .input{padding-left:42px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--hover);font-size:12px;font-weight:600;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.er{background:var(--er-l);color:var(--er)}
.badge.live{background:var(--acc);color:#fff}
.badge.live .dot{animation:pulse 1.4s infinite}
.badge.pts{background:var(--acc-l);color:var(--acc)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(255 255 255/.8)}100%{box-shadow:0 0 0 8px rgb(255 255 255/0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.mut{color:var(--mut)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border:1px solid var(--bd-s);border-radius:18px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--tx)}
.chip:hover{border-color:var(--pri)}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--hover)}
.seg button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--pri-2));transition:width .6s ease}
.bar.warn i{background:linear-gradient(90deg,#f59e0b,var(--acc))}
.bar.full i{background:var(--mut)}
/* Ảnh: có khung dự phòng khi ảnh lỗi hoặc chưa có */
.img{position:relative;overflow:hidden;background:linear-gradient(135deg,#1747a6,#5b8cff 60%,#f05a28);}
.img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.img .fb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;letter-spacing:.02em;text-shadow:0 2px 8px rgb(0 0 0/.25)}
.img img+.fb{display:none}
.img.broken img{display:none}.img.broken .fb{display:grid}
.empty{display:grid;justify-items:center;gap:10px;padding:56px 16px;text-align:center}
.empty .ic{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--pri-l);color:var(--pri)}
.empty .ic svg{width:30px;height:30px}
.empty p{margin:0;max-width:360px}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--hover),var(--bd),var(--hover));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* Hiện dần khi vào màn */
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =====================================================================
   3. KHUNG APP: thanh trên (máy tính) và thanh dưới (điện thoại)
   ===================================================================== */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top-in{display:flex;align-items:center;gap:20px;max-width:1180px;height:68px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap;text-decoration:none;color:var(--tx)}
.brand img{height:38px;width:auto}
.brand span small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;gap:4px}
.nav button{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:12px;background:none;font-weight:600;font-size:14px;color:var(--mut);cursor:pointer;transition:all .15s}
.nav button:hover{color:var(--tx);background:var(--hover)}
.nav button[aria-current="page"]{color:var(--pri);background:var(--pri-l)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700}
.user{display:flex;align-items:center;gap:10px;margin-left:auto}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.user .who{line-height:1.2;font-size:13px}.user .who b{display:block;font-size:14px}
.bnav{display:none}
main{max-width:1180px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left)) 48px}
.h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:28px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}

/* =====================================================================
   4. ĐĂNG NHẬP: nửa ảnh trường, nửa form
   ===================================================================== */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.auth-art{position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:48px;overflow:hidden}
.auth-art .img{position:absolute;inset:0}
.auth-art .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(10 25 60/.15),rgb(10 25 60/.85))}
.auth-art>*:not(.img){position:relative;z-index:1}
.auth-art h1{margin:0 0 10px;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.02em;max-width:520px}
.auth-art p{margin:0;max-width:460px;opacity:.9}
.auth-art .stats{display:flex;gap:28px;margin-top:28px}
.auth-art .stats b{display:block;font-size:26px}
.auth-form{display:grid;place-items:center;padding:40px 24px}
.auth-box{width:100%;max-width:400px;display:grid;gap:20px}
.auth-box .brand img{height:52px}
.demo{display:grid;gap:8px}
.demo button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--bd-s);border-radius:12px;background:none;text-align:left;cursor:pointer;font-size:13px}
.demo button:hover{border-color:var(--pri);background:var(--pri-l)}

/* =====================================================================
   5. MÀN SỰ KIỆN
   ===================================================================== */
.hero{position:relative;display:grid;grid-template-columns:1.2fr 1fr;min-height:300px;border-radius:24px;overflow:hidden;color:#fff;box-shadow:var(--shadow)}
.hero .img{position:absolute;inset:0}
.hero .img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(9 24 58/.92) 0%,rgb(9 24 58/.65) 55%,rgb(9 24 58/.1))}
.hero-b{position:relative;z-index:1;display:grid;gap:14px;align-content:center;padding:36px}
.hero-b h2{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.hero-b .meta{color:rgb(255 255 255/.85)}
.hero:hover .img img{transform:scale(1.04)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mut);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:15px;height:15px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ev{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ev:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
.ev:hover .img img{transform:scale(1.06)}
.ev .img{aspect-ratio:16/9}
.ev .date{position:absolute;left:12px;top:12px;z-index:1;display:grid;justify-items:center;min-width:54px;padding:6px 8px;border-radius:12px;background:var(--card);color:var(--tx);line-height:1.05;box-shadow:0 4px 12px rgb(0 0 0/.15)}
.ev .date b{font-size:20px}.ev .date small{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.ev .tag{position:absolute;right:12px;top:12px;z-index:1}
.ev-b{display:grid;gap:10px;padding:16px;flex:1;align-content:start}
.ev-b h3{margin:0;font-size:16px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.club-l{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.slots{display:grid;gap:6px;font-size:12px}
.slots div{display:flex;justify-content:space-between}
.ev-f{display:flex;align-items:center;gap:10px;padding:0 16px 16px}
.ev-f .btn{flex:1}
.pager{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pager button{min-width:40px;height:40px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-weight:600;cursor:pointer}
.pager button[aria-current="page"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}

/* =====================================================================
   6. MÀN CÂU LẠC BỘ
   ===================================================================== */
.clubgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.club{overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.club:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
.club:hover .img img{transform:scale(1.06)}
.club .img{aspect-ratio:2/1}
.club .logo{position:absolute;left:16px;bottom:-26px;z-index:2;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--card);border:3px solid var(--card);box-shadow:0 4px 12px rgb(0 0 0/.15);color:var(--pri);font-weight:800}
.club-b{display:grid;gap:8px;padding:34px 16px 16px;flex:1;align-content:start}
.club-b h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.club-b p{margin:0;font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.club-f{padding:0 16px 16px}

/* =====================================================================
   7. MÀN CỦA TÔI: sự kiện đang diễn ra + quét QR
   ===================================================================== */
.livecard{position:relative;overflow:hidden;display:grid;grid-template-columns:200px 1fr;border-radius:24px;background:linear-gradient(135deg,#0d2a6b,var(--pri) 60%,#3d6fe0);color:#fff;box-shadow:var(--shadow-up)}
.livecard .img{height:100%;min-height:200px}
.livecard-b{display:grid;gap:14px;padding:28px;align-content:center}
.livecard-b h2{margin:0;font-size:24px;line-height:1.25;font-weight:800}
.livecard-b .meta{color:rgb(255 255 255/.85)}
.livecard-b .acts{display:flex;flex-wrap:wrap;gap:10px}
.livecard-b .btn:not(.acc){background:rgb(255 255 255/.12);border-color:rgb(255 255 255/.3);color:#fff}
.livecard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgb(240 90 40/.45),transparent 70%)}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:14px;align-items:center;padding:14px 16px}
.row+.row{border-top:1px solid var(--bd)}
.row .thumb{width:72px;height:54px;border-radius:12px;flex-shrink:0}
.row-m{flex:1;min-width:0}
.row-m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Điểm rèn luyện */
.ptscard{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--acc),#ff9a3d);color:#fff}
.ptscard b.big{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.03em}
.ptscard::after{content:"★";position:absolute;right:20px;bottom:-30px;font-size:160px;opacity:.15}

/* =====================================================================
   8. QUẢN LÝ
   ===================================================================== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--mut);cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--pri);border-color:var(--pri)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--hover)}
tr:last-child td{border-bottom:0}
.ev-cell{display:flex;gap:12px;align-items:center}
.ev-cell .thumb{width:64px;height:44px;border-radius:10px;flex-shrink:0}
.acts-r{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.drop{position:relative;display:grid;place-items:center;gap:6px;min-height:150px;padding:16px;border:2px dashed var(--bd-s);border-radius:16px;background:var(--hover);text-align:center;cursor:pointer;overflow:hidden;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-l)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--card);color:var(--pri)}
.drop.has .hint-t{position:absolute;bottom:10px;left:50%;translate:-50% 0;padding:4px 10px;border-radius:10px;background:rgb(0 0 0/.6);color:#fff;font-size:12px}
.stat-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px 20px 0}
.stat{padding:14px 16px;border-radius:14px;background:var(--hover)}
.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.semrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:14px 20px}
.semrow+.semrow{border-top:1px solid var(--bd)}
.hbar{display:grid;gap:6px}
.hbar div{display:flex;align-items:center;gap:10px;font-size:12px}
.hbar span.b{height:12px;border-radius:6px;min-width:4px;background:linear-gradient(90deg,var(--pri),var(--pri-2));transition:width .6s}
.hbar span.b.a{background:linear-gradient(90deg,var(--acc),#ff9a3d)}
@media (max-width:760px){.stat-cards{grid-template-columns:1fr 1fr}.semrow{grid-template-columns:1fr}}

/* =====================================================================
   9. HỘP THOẠI, QUÉT QR, THÔNG BÁO
   ===================================================================== */
.modal-bg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgb(8 15 32/.6);backdrop-filter:blur(4px);animation:fade .2s}
.modal{width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:24px;padding:24px;box-shadow:0 30px 80px rgb(0 0 0/.35);animation:pop .25s cubic-bezier(.2,.8,.2,1.1)}
.modal.wide{max-width:640px}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.modal-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-h h3{margin:0;flex:1;font-size:18px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:var(--hover);cursor:pointer;color:var(--tx)}
.scan{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#0b1220}
.scan #reader{width:100%;height:100%}
.scan #reader video{width:100%!important;height:100%!important;object-fit:cover}
.scan .frame{position:absolute;inset:16%;border-radius:20px;pointer-events:none;box-shadow:0 0 0 999px rgb(0 0 0/.35)}
.scan .frame::before{content:"";position:absolute;inset:0;border-radius:20px;border:3px solid #fff;-webkit-mask:conic-gradient(from 90deg at 28% 28%,#0000 25%,#000 0) 0 0/50% 50%;mask:conic-gradient(from 90deg at 28% 28%,#0000 25%,#000 0) 0 0/50% 50%}
.scan .line{position:absolute;left:18%;right:18%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scan 2s ease-in-out infinite;top:18%}
@keyframes scan{50%{top:80%}}

/* Ưu tiên ảnh đã tải về thư mục img/ (chạy nhanh, không phụ thuộc web trường).

const ext = u => (u.split("?")[0].match(/\.(png|jpe?g)$/i) || [0,"jpg"])[1].replace("jpeg","jpg");
const HPU = Object.fromEntries(Object.entries(HPU_URL).map(([k,u]) => [k, `img/${k}.${ext(u)}`]));
const REMOTE = Object.fromEntries(Object.entries(HPU_URL).map(([k,u]) => [HPU[k], u]));
function imgErr(el) {
  const r = REMOTE[el.getAttribute("src")];
  if (r && !el.dataset.tried) { el.dataset.tried = 1; el.src = r; return; }
  el.parentNode.classList.contains("img") ? el.parentNode.classList.add("broken") : el.remove();
}

/* =====================================================================
   B. GỌI API. Chạy qua Nginx thì gọi /api. Mở file trực tiếp (file://)
      thì dùng dữ liệu mẫu ở mục C để xem giao diện không cần server.
   ===================================================================== */
/* Tự nhận biết: có backend thật ở /api thì dùng thật, không có thì chạy dữ liệu mẫu */
let DEMO = location.protocol === "file:" || location.search.includes("demo");
async function detectBackend() {
  if (DEMO) return;
  try { const r = await fetch(API + "/openapi.json", { cache:"no-store" }); DEMO = !(r.ok && (r.headers.get("content-type") || "").includes("json")); }
  catch { DEMO = true; }
  if (DEMO && S.token && !S.token.startsWith("demo-")) { S.token = null; save("t", null); }
}
const API = "/api";
let S = { token: load("t"), user: null, tab: "events", q: "", when: "upcoming", club: 0, page: 1, mtab: "events", statClub: 0 };

function load(k){ try { return localStorage.getItem(k); } catch { return null; } }
function save(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} }

async function api(path, opt = {}) {
  if (DEMO) return mock(path, opt);
  const headers = { ...(opt.headers || {}) };
  if (S.token) headers.Authorization = "Bearer " + S.token;
  if (opt.json) { headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(opt.json); }
  const r = await fetch(API + path, { ...opt, headers });
  if (r.status === 401 && S.token) { logout(); throw new Error("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại"); }
  if (!r.ok) {
    const d = (await r.json().catch(() => ({}))).detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg.replace(/^Value error, /, "")).join("; ") : d || "Lỗi " + r.status);
  }
  if (opt.raw) return r;
  return r.status === 204 ? null : r.json();
}

function mock(path, opt) {
  return new Promise((ok, fail) => setTimeout(() => {
    try { ok(mockRoute(path.split("?")[0], new URLSearchParams(path.split("?")[1] || ""), (opt.method || "GET").toUpperCase(), opt)); }
    catch (e) { fail(e); }
  }, 250));
}
function mockRoute(p, q, m, opt) {
  const me = M.me, err = t => { throw new Error(t); }, body = opt.json || {};
  const evOut = e => ({ id:e.id, club_id:e.club_id, title:e.title, description:e.description, location:e.location, start_time:iso(e.start), end_time:iso(e.end),
    capacity:e.capacity, points:e.points, poster_url:e.poster_url, registered_count:M.registrations.filter(r=>r.event_id===e.id).length });
  if (p==="/auth/login") { const f=Object.fromEntries(opt.body); const u=M.users.find(u=>u.email===f.username&&u.password===f.password); if(!u) err("Sai email hoặc mật khẩu"); M.me=u; return {access_token:"demo-"+u.id}; }
  if (p==="/auth/register") { if(M.users.some(u=>u.email===body.email)) err("Email đã được đăng ký"); const u={id:M.users.length+1,...body,role:"student"}; M.users.push(u); return {id:u.id}; }

  if (p==="/auth/me") return me;

  if (p==="/clubs" && m==="POST") { if(M.clubs.some(c=>c.name===body.name)) err("Tên CLB đã tồn tại"); const c={id:M.clubs.length+1,manager_id:me.id,cover_url:"",...body}; M.clubs.push(c); return c; }

  if (p==="/events" && m==="GET") { const s=(q.get("q")||"").toLowerCase(), c=+q.get("club_id")||0; return M.events.filter(e=>e.title.toLowerCase().includes(s)&&(!c||e.club_id===c)).sort((a,b)=>a.start-b.start).map(evOut); }
  if (p==="/events" && m==="POST") { const e={id:M.events.length+1,...body,start:new Date(body.start_time).getTime(),end:new Date(body.end_time).getTime(),poster_url:body.poster_url||""}; if(e.end<=e.start) err("Thời gian kết thúc phải sau thời gian bắt đầu"); M.events.push(e); return evOut(e); }
  if ((x=p.match(/^\/events\/(\d+)\/register$/))) { const e=M.events.find(e=>e.id==x[1]);
    if (m==="DELETE") { M.registrations=M.registrations.filter(r=>!(r.user_id===me.id&&r.event_id===e.id)); return null; }
    if (M.registrations.some(r=>r.user_id===me.id&&r.event_id===e.id)) err("Bạn đã đăng ký sự kiện này");
    if (evOut(e).registered_count>=e.capacity) err("Sự kiện đã đủ số lượng"); M.registrations.push({user_id:me.id,event_id:e.id}); return {}; }
  if (p==="/me/registrations") return M.registrations.filter(r=>r.user_id===me.id).map(r=>r.event_id);
  if ((x=p.match(/^\/events\/(\d+)\/qr$/))) { const code=Math.random().toString(36).slice(2,8); M.codes[x[1]]=code; return {code,expires_at:iso(Date.now()+10*60e3),qr_png_base64:null}; }
  if ((x=p.match(/^\/events\/(\d+)\/checkin$/))) { const e=M.events.find(e=>e.id==x[1]); if(body.code!==M.codes[e.id]&&body.code!=="HPU2026") err("Mã điểm danh không đúng hoặc đã hết hạn");
    if (M.points.some(r=>r.user_id===me.id&&r.event_id===e.id)) err("Bạn đã điểm danh rồi"); M.points.push({user_id:me.id,event_id:e.id,points:e.points}); return {points:e.points}; }
  if (p==="/me/history") { const rows=M.points.filter(r=>r.user_id===me.id).map(r=>{const e=M.events.find(e=>e.id===r.event_id);return {event_id:e.id,title:e.title,start_time:iso(e.start),points:r.points}}); return {total_points:rows.reduce((a,r)=>a+r.points,0),events:rows}; }
  if ((x=p.match(/^\/events\/(\d+)$/)) && m==="DELETE") { if(M.points.some(r=>r.event_id==x[1])) err("Sự kiện đã có sinh viên điểm danh, không thể xóa");
    M.events=M.events.filter(e=>e.id!=x[1]); M.registrations=M.registrations.filter(r=>r.event_id!=x[1]); return null; }
  if ((x=p.match(/^\/clubs\/(\d+)$/)) && m==="DELETE") { if(M.events.some(e=>e.club_id==x[1])) err("CLB vẫn còn sự kiện, hãy xóa các sự kiện trước");
    M.clubs=M.clubs.filter(c=>c.id!=x[1]); M.memberships=M.memberships.filter(r=>r.club_id!=x[1]); return null; }
  if ((x=p.match(/^\/events\/(\d+)\/poster$/))) { const e=M.events.find(e=>e.id==x[1]); const file=opt.body.get("file");
    if (file.size>2*1024*1024) err("Ảnh poster tối đa 2 MB"); if(!/image\/(jpeg|png|webp)/.test(file.type)) err("Chỉ nhận ảnh JPG, PNG hoặc WEBP");
    e.poster_url=URL.createObjectURL(file); return evOut(e); }
  if (p==="/stats/semesters") { const c=+q.get("club_id")||0, sem=d=>{const m=d.getMonth()+1,y=d.getFullYear();return m>=8?`HK1 ${y}-${y+1}`:m===1?`HK1 ${y-1}-${y}`:m<=6?`HK2 ${y-1}-${y}`:`Hè ${y-1}-${y}`};
    const o={}; M.events.filter(e=>!c||e.club_id===c).forEach(e=>{const k=sem(new Date(e.start)),r=o[k]||(o[k]={semester:k,events:0,registrations:0,attendances:0,points:0,t:e.start});
      r.events++; r.registrations+=M.registrations.filter(x=>x.event_id===e.id).length; const a=M.points.filter(x=>x.event_id===e.id); r.attendances+=a.length; r.points+=a.reduce((s,x)=>s+x.points,0); r.t=Math.min(r.t,e.start);});
    return Object.values(o).sort((a,b)=>b.t-a.t).map(r=>({...r,attendance_rate:r.registrations?Math.round(r.attendances/r.registrations*1000)/10:0})); }
  if (p.endsWith("/attendances/export")) err("Xuất Excel cần chạy cùng server (chế độ xem thử không có file)");
  err("Chưa có dữ liệu mẫu cho " + p);
}

async function vEvents() {
  const [events, clubs, regs] = await Promise.all([ api("/events?size=50&q=" + encodeURIComponent(S.q)), api("/clubs?size=50"), S.user.role==="student" ? api("/me/registrations") : [] ]);
  const cn = Object.fromEntries(clubs.map(c => [c.id, c])), mine = new Set(regs);
  const upcoming = events.filter(e => !isPast(e)), past = events.filter(isPast).reverse();
  let list = (S.when === "upcoming" ? upcoming : past).filter(e => !S.club || e.club_id === S.club);
  const featured = upcoming.find(isLive) || upcoming[0];
  const per = 6, pages = Math.max(1, Math.ceil(list.length / per)); S.page = Math.min(S.page, pages);
  const shown = list.slice((S.page - 1) * per, S.page * per);
  const poster = e => e.poster_url || cover(cn[e.club_id]) || HPU.campus;

  const card = (e, i) => {
    const d = dt(e.start_time), left = e.capacity - e.registered_count, pct = Math.min(100, e.registered_count / e.capacity * 100);
    const low = left > 0 && left <= Math.max(3, e.capacity * .1);
    let btn;
    if (isPast(e)) btn = `<button class="btn" disabled>Đã kết thúc</button>`;
    else if (mine.has(e.id)) btn = `<button class="btn danger" data-unreg="${e.id}">Hủy đăng ký</button>`;
    else if (S.user.role !== "student") btn = `<button class="btn" disabled>Chỉ sinh viên đăng ký</button>`;
    else if (left <= 0) btn = `<button class="btn" disabled>Hết chỗ</button>`;
    else btn = `<button class="btn pri" data-reg="${e.id}">Đăng ký</button>`;
    return `<article class="card ev rise" style="animation-delay:${i*60}ms">
      <div style="position:relative">${pic(poster(e), cn[e.club_id]?.name)}<div class="date"><small>${DOW[d.getDay()]}</small><b class="num">${d.getDate()}</b><small style="color:var(--mut)">Th${d.getMonth()+1}</small></div>
       <div class="tag">${isLive(e)?`<span class="badge live"><span class="dot"></span>Đang diễn ra</span>`:mine.has(e.id)?`<span class="badge ok">${ic("check")}Đã đăng ký</span>`:""}</div></div>
      <div class="ev-b"><span class="club-l">${esc(cn[e.club_id]?.name)}</span><h3>${esc(e.title)}</h3>
       <div class="meta"><span>${ic("clock")}${hm(e.start_time)} – ${hm(e.end_time)}</span><span>${ic("pin")}${esc(e.location)}</span></div>
       <div class="slots"><div><span class="mut num">${e.registered_count}/${e.capacity} đã đăng ký</span><b style="color:${left<=0?"var(--mut)":low?"var(--warn)":"var(--ok)"}">${left<=0?"Hết chỗ":`Còn ${left} chỗ`}</b></div><div class="bar ${left<=0?"full":low?"warn":""}"><i style="width:${pct}%"></i></div></div></div>
      <div class="ev-f">${btn}<span class="badge pts">${ic("star")}+${e.points}</span></div></article>`;
  };

  return `${featured ? `<section class="hero rise">${pic(poster(featured), cn[featured.club_id]?.name)}
     <div class="hero-b">${isLive(featured)?`<span class="badge live" style="width:max-content"><span class="dot"></span>Đang diễn ra</span>`:`<span class="badge pts" style="width:max-content">Sắp diễn ra</span>`}
      <h2>${esc(featured.title)}</h2>
      <div class="meta"><span>${ic("users")}${esc(cn[featured.club_id]?.name)}</span><span>${ic("cal")}${DOW[dt(featured.start_time).getDay()]}, ${dmy(featured.start_time)} · ${hm(featured.start_time)}</span><span>${ic("pin")}${esc(featured.location)}</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${S.user.role==="student"&&mine.has(featured.id)&&isLive(featured)?`<button class="btn acc lg" data-scan="${featured.id}">${ic("scan")}Quét mã QR điểm danh</button>`:S.user.role==="student"&&!mine.has(featured.id)?`<button class="btn acc lg" data-reg="${featured.id}">Đăng ký ngay · +${featured.points} điểm</button>`:""}</div></div></section>` : ""}
   <section class="sec"><div class="sec-h"><div><h1 class="h1">Sự kiện</h1><span class="mut small num">${list.length} sự kiện ${S.when==="upcoming"?"sắp tới":"đã qua"}</span></div>
     <div class="seg"><button data-when="upcoming" aria-pressed="${S.when==="upcoming"}">Sắp tới</button><button data-when="past" aria-pressed="${S.when==="past"}">Đã qua</button></div></div>
    <div class="filters"><label class="search">${ic("search")}<input class="input" id="q" placeholder="Tìm sự kiện, nhấn Enter" value="${esc(S.q)}"></label></div>
    <div class="chips"><button class="chip" data-club="0" aria-pressed="${!S.club}">Tất cả CLB</button>${clubs.map(c=>`<button class="chip" data-club="${c.id}" aria-pressed="${S.club===c.id}">${esc(c.name)}</button>`).join("")}</div>
    ${shown.length ? `<div class="evgrid">${shown.map(card).join("")}</div>` : `<div class="card empty"><div class="ic">${ic("calx")}</div><b>Không có sự kiện phù hợp</b><p class="mut small">Thử bỏ bộ lọc CLB hoặc tìm bằng từ khác.</p><button class="btn" data-club="0">Xem tất cả CLB</button></div>`}
    ${pages > 1 ? `<nav class="pager"><button data-page="${S.page-1}" ${S.page===1?"disabled":""}>‹</button>${Array.from({length:pages},(_,i)=>`<button data-page="${i+1}" ${S.page===i+1?'aria-current="page"':""}>${i+1}</button>`).join("")}<button data-page="${S.page+1}" ${S.page===pages?"disabled":""}>›</button></nav>` : ""}
   </section>`;
}

/* Ảnh poster: kiểm tra ở trình duyệt cho nhanh, server vẫn kiểm tra lại lần nữa */
function posterError(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return "Chỉ nhận ảnh JPG, PNG hoặc WEBP";
  if (file.size > 2 * 1024 * 1024) return "Ảnh poster tối đa 2 MB";
}
function uploadPoster(id, file) { const fd = new FormData(); fd.append("file", file); return api(`/events/${id}/poster`, { method:"POST", body:fd }); }
document.addEventListener("change", e => {
  const id = e.target.dataset?.poster; if (!id) return; const file = e.target.files[0]; if (!file) return;
  const bad = posterError(file); if (bad) return toast(bad, true);
  act(() => uploadPoster(+id, file), "Đã cập nhật ảnh poster");
});

/* Hộp xác nhận trước khi xóa (không dùng confirm() của trình duyệt) */
function confirmDelete(title, msg, run) {

  $("#okDel").onclick = () => { closeModal(); act(run, "Đã xóa"); };
}

/* Thống kê sự kiện theo học kỳ */
async function vStats(clubs) {
  const rows = await api("/stats/semesters" + (S.statClub ? "?club_id=" + S.statClub : ""));
  const sum = k => rows.reduce((a, r) => a + r[k], 0), maxR = Math.max(1, ...rows.map(r => r.registrations));
  const tot = sum("registrations"), rate = tot ? Math.round(sum("attendances") / tot * 100) : 0;
  return `<div style="padding:20px 20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between">
     <div><h3 class="h2">Thống kê sự kiện theo học kỳ</h3><span class="mut small">HK1: tháng 8 – tháng 1 · HK2: tháng 2 – tháng 6 · Hè: tháng 7</span></div>
     <label class="field" style="min-width:220px">Câu lạc bộ<select class="input" id="statClub"><option value="0">Tất cả CLB của tôi</option>${clubs.map(c=>`<option value="${c.id}" ${S.statClub===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label></div>
   <div class="stat-cards"><div class="stat"><span class="mut small">Sự kiện</span><b>${sum("events")}</b></div><div class="stat"><span class="mut small">Lượt đăng ký</span><b>${tot}</b></div>
    <div class="stat"><span class="mut small">Lượt điểm danh</span><b>${sum("attendances")}</b></div><div class="stat"><span class="mut small">Tỷ lệ có mặt</span><b>${rate}%</b></div></div>
   ${rows.length ? `<div style="padding:12px 0">${rows.map(r=>`<div class="semrow"><div><b>${esc(r.semester)}</b><div class="mut small">${r.events} sự kiện · ${r.points} điểm RL đã cộng</div></div>
     <div class="hbar"><div><span class="b" style="width:${r.registrations/maxR*80}%"></span><span class="num">${r.registrations} đăng ký</span></div>
     <div><span class="b a" style="width:${r.attendances/maxR*80}%"></span><span class="num">${r.attendances} điểm danh · ${r.attendance_rate}%</span></div></div></div>`).join("")}</div>`
   : `<div class="empty"><div class="ic">${ic("chart")}</div><b>Chưa có dữ liệu thống kê</b></div>`}`;
}
function bindManage() {
  const ev = $("#evForm"); if (ev) ev.onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const file = $("#posterIn").files[0]; delete f.poster;
    if (file && posterError(file)) return toast(posterError(file), true);
    ["club_id","capacity","points"].forEach(k => f[k] = +f[k]);
    act(async () => { const created = await api("/events", { method:"POST", json:f }); if (file) await uploadPoster(created.id, file); S.mtab = "events"; }, "Đã tạo sự kiện"); };
  const pin = $("#posterIn"), drop = $("#drop");
  if (pin) {
    pin.onchange = () => { const file = pin.files[0]; drop.querySelector("img")?.remove(); drop.classList.remove("has"); if (!file) return;
      const bad = posterError(file); if (bad) { pin.value = ""; return toast(bad, true); }
      const im = document.createElement("img"); im.src = URL.createObjectURL(file); im.alt = "Xem trước poster"; drop.prepend(im); drop.classList.add("has");
      drop.querySelector(".hint-t").textContent = file.name + " · bấm để đổi ảnh"; };
    ["dragenter","dragover"].forEach(t => drop.addEventListener(t, () => drop.classList.add("over")));
    ["dragleave","drop"].forEach(t => drop.addEventListener(t, () => drop.classList.remove("over")));
  }
  const sc = $("#statClub"); if (sc) sc.onchange = () => { S.statClub = +sc.value; render(); };
  const cl = $("#clubForm"); if (cl) cl.onsubmit = e => { e.preventDefault(); act(async () => { await api("/clubs", { method:"POST", json:Object.fromEntries(new FormData(e.target)) }); }, "Đã tạo câu lạc bộ"); };
}

/* =====================================================================
   L. HỘP THOẠI: quét QR, nhập mã, mở QR cho ban chủ nhiệm
   ===================================================================== */
let scanner = null, qrTimer = null;
function closeModal() {
    const sc = scanner; scanner = null;
  if (sc) { try { Promise.resolve(sc.stop()).catch(()=>{}).finally(()=>{ try { sc.clear(); } catch {} }); } catch {} }
  clearInterval(qrTimer); $("#modal").innerHTML = "";
}
function modal(html, wide) {
  $("#modal").innerHTML = `<div class="modal-bg" data-close><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
}
function head(t) { return `<div class="modal-h"><h3>${t}</h3><button class="icon-btn" data-close-btn aria-label="Đóng">${ic("x")}</button></div>`; }

async function doCheckin(eventId, code) {
  try {
    const d = await api(`/events/${eventId}/checkin`, { method:"POST", json:{ code:code.trim() } });
    if (scanner) { await scanner.stop().catch(()=>{}); scanner = null; }
    modal(`<div class="success"><div class="burst">${ic("check")}</div><h3 class="h2">Điểm danh thành công</h3><div class="plus">+${d.points} điểm</div><p class="mut small">Điểm rèn luyện đã được cộng vào tài khoản của bạn.</p><button class="btn pri block" data-close-btn>Xong</button></div>`);
    render();
  } catch (e) { toast(e.message, true); }
}
function openScan(id) {
  modal(head("Quét mã QR điểm danh") + `<div class="scan"><div id="reader"></div><div class="frame"></div><div class="line"></div><div class="hint">Đưa mã QR ban chủ nhiệm đang chiếu vào khung</div></div>
    <p class="small mut" style="text-align:center">Camera không bật được? <a href="#" data-code="${id}">Nhập mã thay thế</a></p>`);
  if (!window.Html5Qrcode) { toast("Không tải được thư viện quét QR, hãy nhập mã", true); return; }
  scanner = new Html5Qrcode("reader");
  scanner.start({ facingMode:"environment" }, { fps:10, qrbox:220 }, text => doCheckin(id, text), () => {})
    .catch(() => toast("Không mở được camera. Hãy cho phép quyền camera hoặc nhập mã.", true));
}
function openCode(id) {
  closeModal();
  modal(head("Nhập mã điểm danh") + `<form id="codeForm" style="display:grid;gap:14px"><label class="field">Mã gồm các chữ số và chữ cái trên màn hình chiếu<input class="input" id="codeIn" required maxlength="20" autocomplete="off" style="font-size:22px;letter-spacing:.15em;text-align:center;height:56px" placeholder="VD: k3F9xQ"></label>
    ${DEMO?`<span class="small mut">Xem thử: dùng mã <b>HPU2026</b></span>`:""}<button class="btn pri lg block">Điểm danh</button></form>`);
  $("#codeIn").focus();
  $("#codeForm").onsubmit = e => { e.preventDefault(); doCheckin(id, $("#codeIn").value); };
}
async function openQR(id) {
  try {
    const d = await api(`/events/${id}/qr`, { method:"POST" });
    const img = d.qr_png_base64 ? `<img src="data:image/png;base64,${d.qr_png_base64}" alt="Mã QR điểm danh">` : `<div class="img" style="width:240px;height:240px;border-radius:16px"><div class="fb" style="display:grid">QR</div></div>`;
    modal(head("Mã QR điểm danh") + `<div class="qrbox">${img}<span class="mut small">Hoặc đọc mã cho sinh viên nhập tay</span><div class="code">${esc(d.code)}</div><span class="badge warn num" id="qrLeft"></span><button class="btn block" data-qr="${id}">Tạo mã mới</button></div>`);
    const end = dt(d.expires_at).getTime();
    const tick = () => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $("#qrLeft"); if (el) el.textContent = s ? `Hết hạn sau ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}` : "Mã đã hết hạn"; };
    tick(); qrTimer = setInterval(tick, 1000);
  } catch (e) { toast(e.message, true); }
}
async function downloadXlsx(id) {
  try { const b = await (await api(`/events/${id}/attendances/export`, { raw:true })).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `diem-danh-${id}.xlsx`; a.click(); }
  catch (e) { toast(e.message, true); }
}

/* =====================================================================
   M. VẼ MÀN HÌNH VÀ GẮN SỰ KIỆN BẤM
   ===================================================================== */
async function render() {
  const app = $("#app");
  if (!S.token) { app.innerHTML = vAuth(S.authMode); bindAuth(S.authMode || "login"); return; }
  if (!S.user) { try { S.user = await api("/auth/me"); } catch (e) { S.token = null; save("t", null); toast(e.message, true); return render(); } }
  const views = { events:vEvents, clubs:vClubs, mine:vMine, points:vPoints, manage:vManage };
  if (!tabsFor().some(([k]) => k === S.tab)) S.tab = "events";
  if (!app.querySelector("main")) app.innerHTML = shell(loadingGrid(3), S.pending);
  try {
    const html = await views[S.tab]();
    app.innerHTML = shell(html, S.pending);
    if (S.tab === "manage") bindManage();
    if (S.tab === "points") countUp($("#ptsNum"), +($("#ptsNum")?.dataset.v || 0) || (await api("/me/history")).total_points);
  } catch (e) {
    app.innerHTML = shell(`<div class="card empty"><div class="ic" style="background:var(--er-l);color:var(--er)">${ic("alert")}</div><b>Không tải được dữ liệu</b><p class="mut small">${esc(e.message)}</p><button class="btn" data-retry>Thử lại</button></div>`, S.pending);
  }
}
/* Một số khung xem trước chặn việc gửi form, nên tự xử lý nút gửi và phím Enter */
function submitForm(form) { if (form.reportValidity() && form.onsubmit) form.onsubmit({ preventDefault(){}, target:form }); }
document.addEventListener("click", e => {
  const sb = e.target.closest("form button:not([type=button])");
  if (sb) { e.preventDefault(); submitForm(sb.form); return; }
  const t = e.target.closest("button,a,[data-close]"); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined && e.target !== t) return;          // bấm trong hộp thoại thì không đóng
  if (d.close !== undefined || d.closeBtn !== undefined) { closeModal(); return; }
  if (d.tab) { e.preventDefault(); S.tab = d.tab; S.page = 1; render(); window.scrollTo({ top:0 }); return; }
  if (d.logout !== undefined) { logout(); return; }
  if (d.retry !== undefined) { render(); return; }
  if (d.when) { S.when = d.when; S.page = 1; render(); return; }
  if (d.club !== undefined) { S.club = +d.club; S.page = 1; render(); return; }
  if (d.page) { S.page = +d.page; render(); return; }
  if (d.mtab) { S.mtab = d.mtab; if (S.tab !== "manage") S.tab = "manage"; render(); return; }
  if (d.reg) { act(() => api(`/events/${d.reg}/register`, { method:"POST" }), "Đã đăng ký sự kiện"); return; }
  if (d.unreg) { act(() => api(`/events/${d.unreg}/register`, { method:"DELETE" }), "Đã hủy đăng ký"); return; }
  if (d.join) { act(() => api(`/clubs/${d.join}/join`, { method:"POST" }), "Đã gửi yêu cầu gia nhập"); return; }
  if (d.review) { const [id, status] = d.review.split("|"); act(() => api(`/memberships/${id}`, { method:"PATCH", json:{ status } }), status === "approved" ? "Đã duyệt thành viên" : "Đã từ chối"); return; }
  if (d.scan) { openScan(+d.scan); return; }
  if (d.code) { e.preventDefault(); openCode(+d.code); return; }
  if (d.qr) { closeModal(); openQR(+d.qr); return; }
  if (d.xlsx) { downloadXlsx(+d.xlsx); return; }
  if (d.delev) { const [id, name] = d.delev.split(/\|(.*)/s); confirmDelete("Xóa sự kiện?", `Sự kiện <b>${esc(name)}</b> và danh sách đăng ký sẽ bị xóa. Không thể hoàn tác.`, () => api(`/events/${id}`, { method:"DELETE" })); return; }
  if (d.delclub) { const [id, name] = d.delclub.split(/\|(.*)/s); confirmDelete("Xóa câu lạc bộ?", `<b>${esc(name)}</b> và danh sách thành viên sẽ bị xóa. Không thể hoàn tác.`, () => api(`/clubs/${id}`, { method:"DELETE" })); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && e.target.form && e.target.tagName === "INPUT") { e.preventDefault(); submitForm(e.target.form); return; }
  if (e.key === "Enter" && e.target.id === "q") { S.q = e.target.value; S.page = 1; render(); }
});
detectBackend().then(render);
</script>
</body>
